# Installed as $CODEX_HOME/config.toml. Default is "no tools": everything that gives the model a tool, or brings in
# outside context, is off. Based on `codex features list` of Codex 0.166.0.
# These settings cannot empty the tool list on their own: harness/tool_stripper.py does that on the wire.
approval_policy = "never"
sandbox_mode = "read-only"
web_search = "disabled"
cli_auth_credentials_store = "file"
project_doc_max_bytes = 0
check_for_update_on_startup = false
include_permissions_instructions = false
include_environment_context = false
include_apps_instructions = false

[skills]
include_instructions = false

[skills.bundled]
enabled = false

[tools.experimental_request_user_input]
enabled = false

[features]
apps = false
async_compaction = false
auth_elicitation = false
browser_annotation_api = false
browser_use = false
browser_use_external = false
browser_use_full_cdp_access = false
code_mode = false
code_mode_host = false
code_mode_interrupt = false
code_mode_only = false
computer_use = false
daemon_auto_start = false
enable_request_compression = false
fast_mode = false
goals = false
guardian_approval = false
hooks = false
image_generation = false
in_app_browser = false
in_app_chat = false
in_app_dictation = false
in_app_local_automation = false
in_app_updates = false
in_app_voice = false
memories = false
mentions_v2 = false
multi_agent = false
multi_agent_v2 = false
personality = false
plugin_discovery_prefetch = false
plugin_sharing = false
plugins = false
remote_compaction_v2 = false
remote_plugin = false
shell_snapshot = false
shell_tool = false
skill_mcp_dependency_install = false
skill_search = false
sleep_tool = false
standalone_web_search = false
tool_call_mcp_elicitation = false
tool_search = false
tool_suggest = false
unbounded_connection_retries = false
unified_exec = false
unified_exec_tty = false
view_image = false
workspace_dependencies = false
